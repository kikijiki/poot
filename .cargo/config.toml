# `checksum-freshness`: flake.nix shares one CARGO_TARGET_DIR across every worktree (card 395/432).
# Cargo's unit hash for path packages does not include the worktree path, and default mtime freshness
# lets a build in worktree B accept an artifact built from worktree A's different source as fresh
# (observed: E0432 flakiness, a false exit-0 on a real E0308). Checksum freshness compares source
# checksums instead of mtimes, so the shared target dir is only safe with it on. An `[unstable]` table
# is a stable-cargo error, but every in-tree build path is the pinned nightly (rust-toolchain.toml);
# the benchmarks image build context is benchmarks/ only, so it never sees this file.
#
# No `[build] rustc-wrapper` here: the committed build must work on a machine with only the devshell's
# tools. kache, the optional content-addressed rustc cache, is enabled by the devshell (flake.nix) when
# it is on PATH, or per machine with RUSTC_WRAPPER / a user-level ~/.cargo/config.toml.
[unstable]
checksum-freshness = true
