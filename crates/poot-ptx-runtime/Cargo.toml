[package]
name = "poot-ptx-runtime"
description = "poot PTX runtime: device-resident dispatch of poot-emitted NVPTX kernels via cudarc (the wgpu poot-wgpu-runtime analogue)"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# ADR-0113: the host upload and download entry points (`upload_f16`, `download_i32`) that other crates'
# dispatch tests (poot-kernelgen, poot-ptx-device) drive a context through; no production caller.
# Enabled only from `[dev-dependencies]` edges.
test-support = []

[dependencies]
# `CompiledKernel`, the one handle a dispatch takes, and the compiler its tests build fixture kernels with.
poot-codegen.workspace = true
# `IndexWidth`/`IndexBound`, the index domain a narrowed kernel is refused a binding outside of (POOT-1405).
poot-kernel-ir.workspace = true
poot-runtime-common.workspace = true
poot-target.workspace = true
cudarc.workspace = true
thiserror.workspace = true

[dev-dependencies]
poot-kernel-ir = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
