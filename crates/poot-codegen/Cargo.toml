[package]
name = "poot-codegen"
description = "poot kernel codegen: poot-kernel-ir Body -> LLVM IR -> llc -> SPIR-V / PTX"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# ADR-0113: `test_support::scripted_toolchain` has no production caller, only the executor and compiler tests
# above this crate (dead-pub, POOT-664).
test-support = []

[dependencies]
blake3.workspace = true
poot-kernel-ir.workspace = true
poot-npu-artifacts.workspace = true
poot-runtime-common.workspace = true
poot-target.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `no_contract_probe_kernel` (`poot_kernel_ir::test_support`, ADR-0113).
poot-kernel-ir = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
