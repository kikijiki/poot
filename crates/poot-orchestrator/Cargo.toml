[package]
name = "poot-orchestrator"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Local, resumable orchestrator for poot benchmark sweeps on rented RunPod GPUs"

[[bin]]
name = "poot-orchestrator"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
# Blocking HTTP with rustls (no system OpenSSL); json for the RunPod REST API.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled SQLite (no system dependency); the durable run-state store.
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
anyhow = "1"
thiserror.workspace = true
ctrlc = { version = "3", features = ["termination"] }
# Blocking HTTP server for the read-only `serve` dashboard (the crate is sync, no tokio).
tiny_http = "0.12"

[lints]
workspace = true
