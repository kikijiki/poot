[package]
name = "poot-executor-parity"
description = "Dev-only table-driven parity fixtures for the executor contract: run_once/run_parity take the oracle as a parameter, so poot-executor never depends on poot-eval"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
poot-codegen.workspace = true
poot-tensor.workspace = true
poot-executor.workspace = true
poot-graph-plan = { workspace = true, features = ["test-support"] }
# This crate is itself test-only fixtures (ruling XC2-06): the device crates dev-depend on it, so the fixture
# modules it builds on are its normal surface and each owner's `test-support` feature is enabled here.
poot-graph-ir = { workspace = true, features = ["test-support"] }
poot-eval = { workspace = true, features = ["test-support"] }
poot-quant = { workspace = true, features = ["test-support"] }
poot-weights = { workspace = true, features = ["test-support"] }
poot-target.workspace = true
poot-runtime-common.workspace = true
poot-test-util.workspace = true

[lints]
workspace = true
