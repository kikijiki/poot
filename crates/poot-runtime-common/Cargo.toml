[package]
name = "poot-runtime-common"
description = "Backend-neutral helpers shared by poot GPU runtimes"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# ADR-0113: `device_skip` holds the device-test skip helpers no production code calls (card 671). Enabled only
# from `[dev-dependencies]` edges.
test-support = []

[dependencies]
# Dynamically loaded (no Vulkan SDK at build time); only the property structs of `vulkan_probe`.
ash.workspace = true
libc.workspace = true

[lints]
workspace = true
