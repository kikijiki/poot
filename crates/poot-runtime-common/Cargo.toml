[package]
name = "poot-runtime-common"
description = "Backend-neutral helpers shared by poot GPU runtimes"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# poot-target (card 608): a leaf crate every other poot crate may depend on (card 522),
# not a backend runtime/driver/executor/graph/planner, so this stays within ADR-0097's boundary.
[features]
# ADR-0113: `device_skip` holds the device-test skip helpers no production code calls (card 671). Enabled only
# from `[dev-dependencies]` edges.
test-support = []

[dependencies]
poot-target.workspace = true

[lints]
workspace = true
