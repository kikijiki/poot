[package]
name = "poot-graph-plan"
description = "Backend-neutral per-eqn execution planner: map a graph-IR op to a kernelgen Body + cache key, a host fallback, or a buffer alias"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# ADR-0113: `per_eqn_plans_outside_compile` has no production caller anywhere in the
# workspace - it reads this crate's own private state (a crate-private thread-local
# counter), so it cannot move to poot-test-util and stays here gated. A default build never has it;
# consumers (this crate's own tests, poot-wgpu-device's tests) call them directly through this feature, never
# through a forwarder. (`is_decode_gemv`/`is_tiled_gemm` were the same shape but had no private-state reason
# to stay - deleted; their callers now check the planned `Plan` instead.) The `test_support` module (plan_eqn,
# the GPU-target accessors) sits behind the same feature.
test-support = ["poot-codegen/test-support"]

[dependencies]
poot-codegen.workspace = true
poot-graph-ir.workspace = true
# serde: the B=1 decode GEMV Body is loaded from a committed .kir.json
poot-kernel-ir = { workspace = true, features = ["serde"] }
poot-kernelgen.workspace = true
poot-quant.workspace = true
poot-weights.workspace = true
poot-npu-artifacts.workspace = true
poot-target.workspace = true
poot-tensor.workspace = true
thiserror.workspace = true
serde_json.workspace = true
blake3.workspace = true

[dev-dependencies]
poot-quant = { workspace = true, features = ["test-support"] }
poot-weights = { workspace = true, features = ["test-support"] }
poot-graph-ir = { workspace = true, features = ["test-support"] }
# This crate's own `tests/*.rs` integration binaries see its `test_support` (`plan_eqn`, the GPU-target
# accessors) and the gated `per_eqn_plans_outside_compile` (ADR-0113) through this
# self edge; they only see the crate's pub API, not its in-crate `*_analyzed` entry point.
poot-graph-plan = { path = ".", features = ["test-support"] }
poot-codegen = { workspace = true, features = ["test-support"] }
# ADR-0113: `sampler_bodies.rs`'s own `#[cfg(test)]` module calls `poot_kernel_ir::interp::Buffer::from_f32s`/
# `to_f32s` directly, gated behind `test-support` in poot-kernel-ir.
poot-kernel-ir = { workspace = true, features = ["test-support"] }
# Strided-view fuzz test (spec 132): checks a view's index math against poot-eval's `apply_movement`
# (the CPU oracle for Transpose/Slice/Broadcast). `test-support`: `apply_movement` has no production
# caller left (card 626), gated behind this feature edge (ADR-0113), not a forwarder.
poot-eval = { workspace = true, features = ["test-support"] }
# `default_caps_for` fixture for this crate's own `tests/*.rs` integration binaries: a `#[cfg(test)]`
# item in `src/` (predicates.rs's own twin) is invisible to those (card 522).
poot-test-util.workspace = true
# The AIE bind-check fixtures `kernel_mapping`'s tests drive (`check_aie_bindings`, `core_lengths`).
poot-npu-artifacts = { workspace = true, features = ["test-support"] }
poot-runtime-common = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
