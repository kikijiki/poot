[package]
name = "poot-models"
description = "Model forward decompositions (the tracers) authored against poot-graph-ir's op surface"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
poot-graph-ir.workspace = true
poot-tensor.workspace = true
poot-load.workspace = true
# `Model::weights` returns a `WeightMap`; `RawConfig::HfJson` carries the parsed `config.json`
# and `generation_config.json`.
poot-quant.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `graph-fixtures`: the reimplemented `plan_eqn` wrapper and `default_caps_for`; it also carries
# `poot-graph-plan/test-support` (`reassociation_class`, `per_eqn_plans_outside_compile`, ADR-0113) to the
# integration tests that trace models through `compile`.
poot-test-util = { workspace = true, features = ["graph-fixtures", "kernel-fixtures"] }
poot-eval.workspace = true
poot-executor-parity.workspace = true
poot-runtime-common.workspace = true
# Card 534a: fold_dense_bf16_row_gathers is pub(crate) in poot-graph-plan now,
# reachable only through prepare_target_graph. The planner's pass-soundness tests that trace models live
# here (POOT-755): a model crate sits above the planner, never the reverse.
poot-graph-plan.workspace = true
poot-kernel-ir.workspace = true
poot-kernelgen.workspace = true
poot-target.workspace = true
criterion.workspace = true

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
