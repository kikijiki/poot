[package]
name = "poot-eval"
description = "poot's CPU eager reference executor for the graph IR (oracle stage 1: decomposition correctness)"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# ADR-0113: `apply_movement` (card 626) has no production caller left (the pre-contract device
# executors it fell back to died in Cards 546b/549); the graph planner's strided-view fuzz test (spec
# 132) is its only remaining caller, a dev-dependent crate reached through this feature edge, never a
# forwarder. (Literal crate name omitted here: `poot_eval_does_not_depend_on_graph_plan` string-matches
# this file for it - the dependency runs the other way, a dev-only cycle Cargo allows.)
test-support = ["dep:poot-test-util"]

# poot-eval is dev-only (every dependent takes it through `test-support` from a dev-dependency), so it reads the
# test-only API of the IR, quant and tensor crates unconditionally (POOT-ADR-0113): the oracle's decompositions
# (`decompose`), packed bindings, `f32_to_bf16` and `reshaped` have no other user.
[dependencies]
poot-graph-ir = { workspace = true, features = ["test-support"] }
poot-quant = { workspace = true, features = ["test-support"] }
poot-weights = { workspace = true, features = ["test-support"] }
poot-tensor = { workspace = true, features = ["test-support"] }
libm.workspace = true
# `fill`, the seeded fill the live-attention fixture draws its operands from; present only under `test-support`.
poot-test-util = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
poot-target.workspace = true
poot-test-util.workspace = true

[lints]
workspace = true
