[package]
name = "poot-kernelgen"
description = "Generate shape-specialized poot-kernel-ir Bodies for primitive tensor ops"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The cost-model fit (`fit_cost_ratios`) the `calibrate_launch` device examples run: a measurement tool's code, not
# a production path (ADR-0113).
test-support = []

[dependencies]
poot-kernel-ir.workspace = true
# `generate` reads the target's `Backend` and `DeviceCaps` (the leaf crate every poot crate may depend on).
poot-target.workspace = true
# The packed decode emitter (`crate::packed`) reads `FormatDescriptor` at generation time: kernelgen
# generates kernel bodies for poot-quant's formats, so this is a real (non-dev) dependency of a leaf
# crate, not a cycle (card 542a, dquant.md D1).
poot-quant.workspace = true
# `OperandPrecision` and `FragmentDtype`: the declared operand rounding every schedule of a contraction or attention
# body implements (POOT-1430). Their rounding helpers live here, in `crate::precision`.
poot-graph-ir.workspace = true
thiserror.workspace = true

[dev-dependencies]
poot-graph-ir = { workspace = true, features = ["test-support"] }
# `round_to_fragment`: the oracle's definition of the operand narrowing, which the operand-precision rows hold the
# generated bodies' staged values against bit for bit.
poot-eval.workspace = true
poot-quant = { workspace = true, features = ["test-support"] }
# ADR-0113: this crate's own `#[cfg(test)]` module (`emit.rs`) and its `tests/{flash,rope}_interp.rs`
# call `poot_kernel_ir::interp::Buffer::from_f32s`/`from_u32s`/`to_f32s` directly, gated behind
# `test-support` in poot-kernel-ir.
poot-kernel-ir = { workspace = true, features = ["test-support"] }
poot-codegen = { workspace = true, features = ["test-support"] }
poot-wgpu-runtime = { workspace = true, features = ["test-support"] }
# The fragment-IR probe (tests/fragment_lds_probe.rs) dispatches on raw Vulkan as well as wgpu.
poot-vulkan-runtime.workspace = true
poot-ptx-runtime = { workspace = true, features = ["test-support"] }
# The packed-kernel ROCm device rows (card 542a SC-004/SC-005) dispatch generated bodies on real
# ROCm/HSA hardware, the same real-executable-path proof card 628's no_contract tests use.
poot-rocm-runtime.workspace = true
# The AIE bind-check fixtures the NPU artifact rows drive (`check_aie_bindings`, `core_lengths`).
poot-npu-artifacts = { workspace = true, features = ["test-support"] }
poot-runtime-common = { workspace = true, features = ["test-support"] }
poot-test-util.workspace = true

[lints]
workspace = true
