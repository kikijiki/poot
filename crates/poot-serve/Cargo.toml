[package]
name = "poot-serve"
description = "A minimal OpenAI-compatible HTTP server over the poot driver"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
poot-llm.workspace = true
# `ChatFormat` (the fallback chat format) lives with the model families.
poot-models.workspace = true
# The engine plan opens an executor, reads its targets and fits the workload to their memory.
poot-executor.workspace = true
# The timing snapshot the engine publishes is summarized with its own report.
poot-profile.workspace = true
poot-graph-plan.workspace = true
poot-target.workspace = true
# LoRA administration loads a PEFT adapter directory; the synthetic GGUF writer of the startup and
# handler fixtures (`tests/support/tiny_gguf.rs`) uses it too.
poot-load.workspace = true
clap.workspace = true
# `encoding_format: base64` embeddings.
base64.workspace = true
anyhow.workspace = true
ring.workspace = true
subtle.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sysinfo.workspace = true
thiserror.workspace = true

[dev-dependencies]
poot-test-util.workspace = true
# The fixture device of the engine-plan rows counts allocations the way a runtime does.
poot-runtime-common.workspace = true
poot-quant.workspace = true
# The dtype of the synthetic LoRA adapter the device rows write.
poot-tensor.workspace = true
poot-graph-ir.workspace = true
# The image the served VLM row sends is a PNG it encodes.
image.workspace = true

[lints]
workspace = true
