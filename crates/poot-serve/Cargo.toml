[package]
name = "poot-serve"
description = "A minimal OpenAI-compatible HTTP server over the poot driver"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
poot-llm.workspace = true
# `ChatFormat` (the fallback chat format) lives with the model families.
poot-models.workspace = true
# The engine plan opens an executor, reads its targets and fits the workload to their memory.
poot-executor.workspace = true
# The timing snapshot the engine publishes is summarized with its own report.
poot-profile.workspace = true
poot-graph-plan.workspace = true
# The sampling heads the engine plan prepares are named by their draw rule and features.
poot-graph-ir.workspace = true
poot-target.workspace = true
poot-runtime-common.workspace = true
# LoRA administration loads a PEFT adapter directory; the synthetic GGUF writer of the startup and
# handler fixtures (`tests/support/tiny_gguf.rs`) uses it too.
poot-load.workspace = true
# The chat format and the text services the OpenAI front end renders prompts and constraints with.
poot-text.workspace = true
clap.workspace = true
# `encoding_format: base64` embeddings.
base64.workspace = true
# An image's header is read for its size before any pixel is decoded; the served VLM rows encode PNGs with it.
image.workspace = true
anyhow.workspace = true
ring.workspace = true
subtle.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sysinfo.workspace = true
thiserror.workspace = true

[dev-dependencies]
poot-graph-plan = { workspace = true, features = ["test-support"] }
# `Budget::with` and `write_gguf`, the fixtures the engine-plan rows build budgets and checkpoints with.
poot-llm = { workspace = true, features = ["test-support"] }
poot-load = { workspace = true, features = ["test-support"] }
poot-test-util.workspace = true
# `TextCodec::with_tokenizer`: the hand-built codecs of the serve rows.
poot-text = { workspace = true, features = ["test-support"] }
# The fixture device of the engine-plan rows builds `CompiledKernel`s and counts allocations the way a runtime does.
poot-codegen.workspace = true
poot-runtime-common = { workspace = true, features = ["test-support"] }
poot-quant = { workspace = true, features = ["test-support"] }
poot-weights = { workspace = true, features = ["test-support"] }
# The dtype of the synthetic LoRA adapter the device rows write.
poot-tensor.workspace = true
poot-graph-ir = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
