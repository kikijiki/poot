edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
poot-codegen.workspace = true
poot-kernel-ir.workspace = true
poot-rocm-runtime.workspace = true
poot-target.workspace = true
poot-runtime-common.workspace = true
