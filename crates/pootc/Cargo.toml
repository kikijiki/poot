[package]
name = "pootc"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "poot's rustc driver: compiles a crate normally (host code via rustc's own backend) and imports #[kernel] fns from Stable MIR into poot-kernel-ir. Invariant 8 (real Rust, real rustc)."

[[bin]]
name = "pootc"
path = "src/main.rs"

# The rustc_* crates come from `extern crate` against the pinned nightly's `rustc-dev` libs, not Cargo
# deps. build.rs rpaths the sysroot lib so librustc_driver-*.so is found at runtime.
[dependencies]
poot-kernel-ir = { workspace = true, features = ["serde"] }
# poot-codegen is the back half (Body -> LLVM -> llc -> SPIR-V/PTX), called from the after_analysis
# hook so a kernel compile produces dispatchable artifacts directly.
poot-codegen.workspace = true
serde_json.workspace = true

# poot-runtime dispatches pootc's emitted .spv in the import-and-run tests. The macro test builds
# poot-kernel-attr itself (see tests/macro_kernel.rs), so it is not a dependency here.
[dev-dependencies]
poot-runtime.workspace = true
# Card 559: `committed_assets_match_their_kernel_sources` iterates `poot_graph_plan::MANIFEST`, the one
# kernel-asset manifest, instead of a hand-kept list duplicated here.
poot-graph-plan.workspace = true
# The equivalence test compiles a kernelgen Body to SPIR-V and compares its GPU output to an imported kernel.
poot-kernelgen.workspace = true
poot-test-util = { workspace = true, features = ["kernel-fixtures"] }
# SC-002 (card 531c): dispatches pootc's emitted .ptx to prove a real Assert traps on PTX, same as
# poot-runtime does for SpirvVulkan above.
poot-ptx-runtime.workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[lints]
workspace = true
