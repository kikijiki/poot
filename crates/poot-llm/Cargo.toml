[package]
name = "poot-llm"
description = "poot LLM driver: load a checkpoint and generate on the wgpu, ROCm and PTX device executors"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
poot-codegen.workspace = true
poot-graph-ir.workspace = true
poot-tensor.workspace = true
poot-models.workspace = true
poot-target.workspace = true
poot-load.workspace = true
poot-wgpu-device.workspace = true
poot-ptx-device.workspace = true
poot-vulkan-device.workspace = true
poot-rocm-device.workspace = true
# Tokenization, chat templates and guided constraints: the checkpoint's text services.
poot-text.workspace = true
# The multimodal front end loads its own tokenizer for the mrope special tokens.
tokenizers.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
# Binary only: the `cli` feature turns it on and the `poot` bin that uses it requires that feature.
# The library's own API is `thiserror` types throughout (`TextError`, `driver::error::DriverError`).
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
# Production code (`components/exact_partition.rs`) builds Card 360 placement/communication rows, so this
# is a regular dependency.
poot-graph-plan.workspace = true
# The checkpoint's weights as stored (ADR-0103): a `poot_quant::weights::WeightStore`, never a widened f32 decode.
poot-quant.workspace = true
poot-weights.workspace = true
# The backend-neutral executor contract the driver runs on.
poot-executor.workspace = true
# The planning device (`driver::capacity`) implements `Device` over the runtime memory counters.
poot-runtime-common.workspace = true
bytemuck.workspace = true
# The driver measures the retained size of each planned kernel body (`program_retention`).
poot-kernel-ir.workspace = true
# `Generation::timing` windows the executor's typed step timing (`poot_profile::Report::window`).
poot-profile.workspace = true

[dev-dependencies]
# A launch of another device's kind (`LaunchKind::Aie`), which the device must refuse.
poot-npu-artifacts.workspace = true
poot-text = { workspace = true, features = ["test-support"] }
# The sampler tests check guided masks against a reference regex engine.
regex-automata.workspace = true
poot-kernel-ir = { workspace = true, features = ["test-support"] }
poot-graph-ir = { workspace = true, features = ["test-support"] }
poot-kernelgen.workspace = true
poot-graph-plan = { workspace = true, features = ["test-support"] }
poot-runtime-common = { workspace = true, features = ["test-support"] }
poot-eval = { workspace = true, features = ["test-support"] }
poot-quant = { workspace = true, features = ["test-support"] }
poot-weights = { workspace = true, features = ["test-support"] }
# The `cli` feature for this package's own tests: it builds the `poot` binary, which the
# `tests/poot_generate_cli.rs` rows spawn (`CARGO_BIN_EXE_poot`), in every lane that builds the tests.
poot-llm = { workspace = true, features = ["cli"] }
# `write_gguf` and `sha256_digest`, the checkpoint writer and hasher the driver tests build with (ADR-0113).
poot-load = { workspace = true, features = ["test-support"] }
# `has_device_timestamps`, the adapter probe the staged-timing row skips on (ADR-0113).
poot-wgpu-device = { workspace = true, features = ["test-support"] }
# The APNG fixtures of the Qwen2.5-VL video tests are stored base64-encoded.
base64.workspace = true
# The examples (`examples/`) are binaries and use it directly.
anyhow.workspace = true
poot-test-util.workspace = true
poot-executor-parity.workspace = true
# The dense family fixtures (`poot_models::test_support::dense`): the graphs the plan and equivalence tests trace.
poot-models = { workspace = true, features = ["test-support"] }
# The boxed-cause chain test constructs each backend's runtime error type to check that `source()` reaches
# it. Already transitive dependencies of the backend crates; listed only so the test can name the types.
# No driver linkage; construction touches no device.
poot-wgpu-runtime.workspace = true
poot-ptx-runtime.workspace = true
poot-rocm-runtime.workspace = true

[features]
# `anyhow`, `clap` and `tracing-subscriber` for the `poot` binary (a bin cannot carry its own dependency).
cli = ["dep:anyhow", "dep:clap", "dep:tracing-subscriber"]
# ADR-0113: `Budget::with`, the budget builder poot-serve's engine-plan tests assemble device budgets with;
# no production caller (the production budget is observed from the device). Enabled only from
# `[dev-dependencies]` edges.
test-support = []

[lib]
name = "poot_llm"
path = "src/lib.rs"

[[bin]]
name = "poot"
path = "src/bin/poot/main.rs"
required-features = ["cli"]

[lints]
workspace = true
