[package]
name = "poot-load"
description = "Safetensors and GGUF weight loading plus HF config parsing for poot, dependency-light"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# ADR-0113: `write_gguf`, the in-memory GGUF writer other crates' tests build checkpoints with (poot is not a
# converter); no production caller.
# Enabled only from `[dev-dependencies]` edges.
test-support = []

[dependencies]
poot-quant.workspace = true
poot-tensor.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ring.workspace = true

[dev-dependencies]
# This crate's own `tests/*.rs` integration binaries build checkpoints with the gated `write_gguf`.
poot-load = { path = ".", features = ["test-support"] }
poot-quant = { workspace = true, features = ["test-support"] }
poot-test-util.workspace = true

[lints]
workspace = true
