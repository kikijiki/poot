# Pinned nightly for poot. The codegen backend links rustc internals via `rustc_private` (nightly-only), so
# the toolchain is pinned exactly and bumped deliberately. `rustc-dev` ships the compiler libs linked;
# `llvm-tools` provides LLVM libs at link time; `rust-src` is needed for rustc_private resolution and
# rust-analyzer. 2026-10-06 (rustc 1.101.0-nightly ea137335b, cargo f3865b2a4; links LLVM 23.1.3) is the known-good
# nightly: `pootc` builds against its `rustc_driver`/`rustc_public` and every kernel asset regenerates byte-identical.
# The system LLVM 22 `llc` (flake.nix) is independent of rustc's own LLVM: kernels cross as `poot_kernel_ir::Body`
# JSON and poot-codegen feeds `llc` textual IR, so the two versions do not have to match.
# Rollback: the previous pin was nightly-2026-04-03 (rustc 1.96.0-nightly 55e86c996, LLVM 22.1.2) with the
# rust-overlay lock at 5106a604b3; restore both and revert the pootc port (`compiler_entrypoint`, `Rvalue::Use`
# carries a `WithRetag`).
[toolchain]
channel    = "nightly-2026-10-06"
components = ["rustc-dev", "rust-src", "llvm-tools", "rust-analyzer", "clippy", "rustfmt"]
profile    = "minimal"
