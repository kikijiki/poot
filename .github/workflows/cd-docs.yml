name: cd-docs

on:
  push:
    branches: [master]
    paths:
      - website/**
      - scripts/site-*
      - .github/workflows/cd-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCS_SITE_URL: https://kikijiki.github.io
      DOCS_BASE_URL: /poot/
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The one script `just site-check` runs (typecheck, component tests, grid, navbar, the production build, stale names,
      # edge bars, card numbers, NPU summaries, readability, ascii), so the published site passes the whole local gate
      # except the Rust snippets, which need the poot toolchain.
      - name: Site checks
        working-directory: .
        run: scripts/site-check.sh --no-toolchain
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
