# poot workspace: a virtual workspace (no root package). The kernel codegen substrate (poot-kernel-ir +
# poot-codegen) concentrates the nightly / rustc_private / LLVM dependencies; everything above it (graph IR,
# tracer, eager executor, models) is plain host Rust that builds and unit-tests without a GPU.
[workspace]
resolver = "3"
members = [
    "crates/poot-graph-ir",
    "crates/poot-tensor",
    "crates/poot-text",
    "crates/poot-executor",
    "crates/poot-executor-parity",
    "crates/poot-models",
    "crates/poot-eval",
    "crates/poot-load",
    "crates/poot-llm",
    "crates/poot-serve",
    "crates/poot-kernel-ir",
    "crates/poot-codegen",
    "crates/poot-profile",
    "crates/poot-test-util",
    "crates/poot-quant",
    "crates/poot-wgpu-runtime",
    "crates/poot-runtime-common",
    "crates/poot-ptx-runtime",
    "crates/poot-rocm-runtime",
    "crates/poot-rocm-device",
    "crates/poot-l0-runtime",
    "crates/poot-vulkan-runtime",
    "crates/poot-vulkan-device",
    "crates/poot-kernelgen",
    "crates/poot-target",
    "crates/poot-graph-plan",
    "crates/poot-wgpu-device",
    "crates/poot-ptx-device",
    "crates/poot-npu",
    "crates/pootc",
    "crates/poot-kernel-attr",
    "crates/poot-kernel-intrinsics",
    "crates/poot-orchestrator",
    # The cross-framework benchmark runner is a member so the binary that is benchmarked resolves from this
    # lockfile and is checked by `--workspace` builds (it enables poot-llm's `rocm` feature).
    "benchmarks/runners/poot",
]

# Test executables dominate a target dir and ~72% of one is DWARF. `test` inherits `dev`, so this covers both:
# backtraces keep file and line; variable inspection in gdb/rocgdb needs `CARGO_PROFILE_DEV_DEBUG=2` or a
# `[profile.dev.package.<crate>] debug = 2` entry.
[profile.dev]
debug = "line-tables-only"

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
authors = ["Matteo Bernacchia <dev@kikijiki.com>"]
repository = "https://github.com/kikijiki/poot"
rust-version = "1.101"

# A bare `#[ignore]` hides why a test is skipped. Every crate opts in with `[lints] workspace = true`.
#
# Facade rule (POOT-756, ADR-0096): a crate root names what other crates use, one `pub use` entry per item
# or `pub mod` per domain; no glob re-export, no prelude, no re-export of another crate's item. `wildcard_imports`
# stops `use crate::*` from rebuilding a flat namespace inside a crate; `unreachable_pub` turns an item that
# no path leaves the crate into `pub(crate)`, so the root is the whole public surface. Prior art, retrieved
# 2026-10-12:
# - Rust API Guidelines, C-HIDDEN: rustdoc shows no unhelpful implementation details.
#   https://rust-lang.github.io/api-guidelines/checklist.html
# - tokio's crate root (tokio/src/lib.rs): 13 `pub mod` domains and 9 `pub use` lines, all macros and `spawn`;
#   every other item is reached through its module path.
#   https://github.com/tokio-rs/tokio/blob/master/tokio/src/lib.rs
# - rustc lint `unreachable_pub` and clippy `wildcard_imports`, the two lints this table enables.
#   https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html#unreachable-pub
#   https://rust-lang.github.io/rust-clippy/master/index.html#wildcard_imports
# The cargo and rustc crate roots were not fetched; no claim is made about them.
[workspace.lints.clippy]
ignore_without_reason = "deny"
wildcard_imports = "deny"
# An outer `#[allow]` hides a lint that stops firing; `#[expect]` fails once the lint is gone (R2-L13-014). Inner
# `#![allow]` attributes, which clippy leaves alone, remain the way to share a test support module across binaries.
allow_attributes = "deny"

# A held `#[expect(dead_code, reason = "held for POOT-N")]` must fail once its item gains a caller: the
# expectation is then unfulfilled, and `unfulfilled_lint_expectations` is warn-by-default. Deny it everywhere.
# Every crate inherits this table via `[lints] workspace = true`; no crate may declare its own `[lints]` table.
[workspace.lints.rust]
dead_code = "deny"
missing_docs = "deny"
deprecated = "deny"
unfulfilled_lint_expectations = "deny"
unreachable_pub = "deny"

[workspace.dependencies]
# internal
poot-graph-ir = { path = "crates/poot-graph-ir" }
poot-tensor = { path = "crates/poot-tensor" }
poot-text = { path = "crates/poot-text" }
poot-executor = { path = "crates/poot-executor" }
poot-executor-parity = { path = "crates/poot-executor-parity" }
poot-models = { path = "crates/poot-models" }
poot-kernel-ir = { path = "crates/poot-kernel-ir" }
poot-codegen = { path = "crates/poot-codegen" }
poot-profile = { path = "crates/poot-profile" }
poot-quant = { path = "crates/poot-quant" }
poot-target = { path = "crates/poot-target" }
poot-graph-plan = { path = "crates/poot-graph-plan" }
poot-wgpu-runtime = { path = "crates/poot-wgpu-runtime" }
poot-runtime-common = { path = "crates/poot-runtime-common" }
poot-ptx-runtime = { path = "crates/poot-ptx-runtime" }
poot-rocm-runtime = { path = "crates/poot-rocm-runtime" }
poot-rocm-device = { path = "crates/poot-rocm-device" }
poot-vulkan-runtime = { path = "crates/poot-vulkan-runtime" }
poot-vulkan-device = { path = "crates/poot-vulkan-device" }
poot-eval = { path = "crates/poot-eval" }
poot-wgpu-device = { path = "crates/poot-wgpu-device" }
poot-kernelgen = { path = "crates/poot-kernelgen" }
poot-l0-runtime = { path = "crates/poot-l0-runtime" }
poot-llm = { path = "crates/poot-llm" }
poot-load = { path = "crates/poot-load" }
poot-ptx-device = { path = "crates/poot-ptx-device" }
poot-test-util = { path = "crates/poot-test-util" }

# external (libraries use typed errors + tracing; binaries may use anyhow)
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
thiserror = "2.0"
# The one file mapping behind `poot_quant::StoredBytes` (ADR-0103 amendment, POOT-1099): owns mmap/munmap/madvise.
memmap2 = "0.9"
# Command-line parsing for the binaries (`poot-serve`, `poot-orchestrator`): one requirement string.
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.5"
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The plan-side kernel-choice digest (card 636): a content hash of the canonical request encoding.
blake3 = "1"
# image decoding for vision-language input: png + jpeg only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# base64 for OpenAI image_url data URLs.
base64 = "0.22"
# wgpu runtime (the SPIR-V dispatch backend).
wgpu = { version = "29.0.3", features = ["spirv"] }
pollster = "0.4"
bytemuck = "1"
# PTX runtime; dynamic-loading dlopens libcuda, so it builds without a CUDA toolkit.
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-12040"] }
# ELF parsing in poot-rocm-runtime's load_hsaco: reads the embedded kernel descriptor for the AQL packet's
# kernel_object handle (the HSA loader APIs only handle V1/V2 code objects; LLVM 22+ emits V4+).
object = { version = "0.36", default-features = false, features = ["std", "read", "elf"] }
# HF tokenizer (loads tokenizer.json)
tokenizers = "0.20"
# jinja engine for a model's chat_template. `json` enables the `tojson` filter used by HF tool-use templates.
minijinja = { version = "2", features = ["json"] }
# HF chat templates call Python dict/str/list methods (`.get`, `.items`, `.strip`, `.startswith`, ...) that
# minijinja lacks; `pycompat` adds them (wired into the Environment in poot-llm's render_jinja_core).
minijinja-contrib = { version = "2", features = ["pycompat"] }
anyhow = "1"
ring = "0.17"
subtle = "2.6"
# Raw system calls (poot-serve's process and signal handling, poot-test-util's child-process guard).
libc = "0.2"
# Correctly rounded libm functions for the CPU oracle's transcendental ops (poot-eval).
libm = "0.2.16"
# Vulkan device-memory budget query (poot-wgpu-runtime), pinned to the versions wgpu 29 itself uses.
ash = "0.38"
wgpu-hal = { version = "29.0.3", features = ["vulkan"] }
# Guided decoding: byte-level DFA for regex-constrained generation (same 0.4 line as tokenizers/regex).
regex-automata = "0.4"
# poot-text: one-pass scan for the special tokens of a vocabulary.
aho-corasick = "1"
# poot-orchestrator: blocking HTTP with rustls (no system OpenSSL) for the RunPod REST API, the bundled
# SQLite run-state store, its config format, the Ctrl-C handler and the read-only dashboard server.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
ctrlc = { version = "3", features = ["termination"] }
tiny_http = "0.12"
# poot-npu's build script (the optional XRT FFI shim).
cc = "1"
