status = "not-run"
reason = "refused at plan time (measured 2026-10-27, 18-34 s): the 26.8 GiB per-layer embedding table is a packed source of 230401105952 bits, over the 4294967295 bits the SPIR-V kernels address (PackedSourceAddressing), so the prefill chunk cannot be fitted; it is not a speed limit"
