# poot benchmark suite - the model + scenario matrix.
#
# Source of truth for what gets benchmarked. The harness enumerates (model x framework x scenario) and runs
# every cell; a cell a tool refuses is recorded as "unsupported" with the refusal as that tool reports it
# (FR-005). Edit here to add a model, a framework precision, or a scenario.
#
# Precision policy (spec 112): match per model where the baseline supports it, document gaps. Each
# framework entry under a model gives the precision that framework runs. A precision that is not
# bit-identical to the matched target (e.g. llama.cpp Q4_K_M vs a GPTQ int4) carries a "caveat".
#
# poot has no support list here. Whether poot runs a model on a backend is decided by planning it (ADR 0104):
# the runner reports a refusal with its own text, and the harness records it. Adding "support" to a poot
# entry fails harness/tests/test_benchmark_manifest.py. The other frameworks are external tools with no such
# report available before a run: "support = false" and its "reason" there is a hand-checked fact about the
# tool (see benchmarks/runners/*/NOTES.md).
#
# poot has three GPU backends selected by the runner's --backend flag: ptx (NVIDIA/PTX), rocm (AMD/ROCm),
# and wgpu (Vulkan/SPIR-V). The same poot-bench-runner binary runs on all three, so the manifest records
# poot as one framework. A poot row's `precision` is the dtype the loaded checkpoint stores (the runner reads it
# from the driver's store and fails the cell when this entry names another), so a cell names the dtype its
# checkpoint holds. `just bench-record <backend>` records a backend's dense cell; the rows of both backends on
# one machine carry the backend and the adapter, and a compare never merges them.

[suite]
# Tokens generated per timed iteration (fixed so cells are comparable). Overridable per scenario.
default_gen_tokens = 128
warmup_iters = 1
timed_iters = 3
seed = 0

# Local checkpoint root: pass --models-dir or set POOT_MODELS_DIR (see bench.py); there is no default.

# ----------------------------------------------------------------------------------------------
# Scenarios: fixed (prompt, gen-token) shapes. Prompts live in benchmarks/prompts/.
# ----------------------------------------------------------------------------------------------
[[scenario]]
id = "decode-128"
prompt_file = "short.txt"   # a few tokens in, 128 out: isolates decode throughput
gen_tokens = 128

[[scenario]]
id = "prefill-1k"
prompt_file = "long.txt"    # ~1000 tokens in, 32 out: isolates prefill / TTFT
gen_tokens = 32

# decode-curve (spec 115): at each ISL (context length) the runner prefills exactly ISL synthetic random
# tokens, then decodes a fixed OSL window, timing every token. The harness reports TPOT/ITL percentiles and
# steady decode tok/s per ISL. Drives every runner's `--mode decode-curve --isl-list ... --osl ... --synthetic`.
[[scenario]]
id = "decode-curve"
kind = "decode-curve"
isl = [128, 2048, 8192]         # context lengths to sweep (cap per the model window + poot prefill cost)
osl = 128                       # decode tokens timed at each ISL (per-token TPOT/ITL -> window-independent)
synthetic = true                # exactly-ISL random in-vocab tokens: tokenizer-neutral + defeats prefix cache

# The large rows (27B, Flash-Next) sweep two contexts: a poot wgpu 27B repeat already takes ~37 min.
[[scenario]]
id = "decode-curve-large"
kind = "decode-curve"
isl = [128, 8192]
osl = 128
synthetic = true

# ----------------------------------------------------------------------------------------------
# Performance evidence policy (spec 1003): what `bench compare` and the performance bank judge a speed
# change by. Declared here, read by harness/performance_receipt.py; nothing else holds a threshold.
#
# Trials are bounded and interleaved by the invoker: at least `min_trials` repeats per side before any
# verdict, at most `max_trials` before the cell is reported unverified with its budget exhausted. Per metric:
# `direction` says which way is worse (latency worse higher, throughput worse lower), `practical_threshold`
# is the relative loss a change must be able to exclude, and `max_uncertainty` the widest relative band
# (twice the larger observed range over the baseline median) a "within noise" verdict may rest on. A band too
# wide to exclude a practical loss is unverified, never success.
#
# A decode-curve cell is compared at its smallest context (`headline_metric`) and at every context the
# baseline measured (`curve_point_metrics`), so a good headline cannot hide a slower long-context token.
# ----------------------------------------------------------------------------------------------
[performance]
min_trials = 5
max_trials = 15
headline_metric = "decode_tok_s"
curve_point_metrics = ["tpot_ms", "ttft_ms"]

[performance.metrics.ttft_ms]
direction = "lower"
practical_threshold = 0.20
max_uncertainty = 0.10

[performance.metrics.tpot_ms]
direction = "lower"
practical_threshold = 0.20
max_uncertainty = 0.10

[performance.metrics.itl_ms]
direction = "lower"
practical_threshold = 0.20
max_uncertainty = 0.10

[performance.metrics.e2e_ms]
direction = "lower"
practical_threshold = 0.20
max_uncertainty = 0.10

[performance.metrics.decode_tok_s]
direction = "higher"
practical_threshold = 0.20
max_uncertainty = 0.10

[performance.metrics.prefill_tok_s]
direction = "higher"
practical_threshold = 0.20
max_uncertainty = 0.10

# Kernel-level wall time of one bank step (the performance bank's metric).
[performance.metrics.step_us]
direction = "lower"
practical_threshold = 0.20
max_uncertainty = 0.10

# ----------------------------------------------------------------------------------------------
# Models. size_class picks which pods can run them (small = Arc + cheap pod; xl = RunPod only).
# Each [model.frameworks.<fw>] = { precision, caveat? } for poot; { support, precision, reason?, caveat? }
# for the other frameworks.
# ----------------------------------------------------------------------------------------------

# qwen2.5-0.5b: poot's most-verified model (coherence and PTX-parity anchor); all baselines run it. Fits the
# cheapest pod.
[[model]]
id = "qwen2.5-0.5b"
arch = "Qwen2ForCausalLM"
hf_repo = "Qwen/Qwen2.5-0.5B-Instruct"
local_dir = "qwen2.5-0.5b"
size_class = "small"
group = "dense"
match_precision = "bf16"
frameworks.poot         = { precision = "bf16", caveat = "poot loads bf16 but computes f32 (engine is f32 end to end)" }
frameworks.candle       = { support = true, precision = "bf16" }
frameworks.transformers = { support = true, precision = "bf16" }
frameworks.vllm         = { support = false, reason = "dropped from the standing grid (2026-10-24): too hard to run properly, llama.cpp is the reference" }
frameworks.llamacpp     = { support = true, precision = "f16", caveat = "GGUF f16 vs bf16" }

[[model]]
id = "qwen3-0.6b"
arch = "Qwen3ForCausalLM"
hf_repo = "Qwen/Qwen3-0.6B"
local_dir = "qwen3-0.6b"
size_class = "small"
group = "dense"
match_precision = "bf16"   # the target precision all frameworks aim to match
# Newest Qwen on the PTX cross-framework bench path (standard transformer + QK-norm, spec 090). The
# Qwen3-Next 35B-A3B MoE runs on poot on-box (wgpu/rocm, card 135) and token-matches llama.cpp, but is not
# on this PTX bench matrix, which is qwen2/qwen3 dense only.
frameworks.poot         = { precision = "bf16" }
frameworks.candle       = { support = true, precision = "bf16" }
frameworks.transformers = { support = true, precision = "bf16" }
frameworks.vllm         = { support = false, reason = "dropped from the standing grid (2026-10-24): too hard to run properly, llama.cpp is the reference" }
frameworks.llamacpp     = { support = true, precision = "f16", caveat = "GGUF f16 vs bf16 - closest full-precision GGUF" }

# Qwen3 dense, the same Qwen3ForCausalLM poot runs at 0.6B. Apache, no HF token. 4B bf16 ~8GB and 8B ~16GB
# fit a 24GB pod; 14B ~28GB needs a 48GB GPU (A6000/A40).
[[model]]
id = "qwen3-4b"
arch = "Qwen3ForCausalLM"
hf_repo = "Qwen/Qwen3-4B"
local_dir = "qwen3-4b"
size_class = "mid"
group = "dense"
match_precision = "bf16"
frameworks.poot         = { precision = "bf16" }
frameworks.candle       = { support = true, precision = "bf16" }
frameworks.transformers = { support = true, precision = "bf16" }
frameworks.vllm         = { support = false, reason = "dropped from the standing grid (2026-10-24): too hard to run properly, llama.cpp is the reference" }
frameworks.llamacpp     = { support = true, precision = "f16", caveat = "GGUF f16 vs bf16" }

# Qwen3-4B Q4_K_M (GGUF arch qwen3, one ~2.5 GB file): the quant-cost row next to the bf16 4B above, on the file
# llama.cpp runs. Only that file is fetched (the repo holds every quant). poot's precision is the dtype most of the
# file's bytes are in (Q4_K; Q6_K holds the rest of the weights Q4_K_M keeps at higher precision).
[[model]]
id = "qwen3-4b-q4km"
arch = "qwen3"
hf_repo = "Qwen/Qwen3-4B-GGUF"
hf_include = ["Qwen3-4B-Q4_K_M.gguf"]
local_dir = "qwen3-4b-gguf"
weights_file = "Qwen3-4B-Q4_K_M.gguf"
size_class = "mid"
group = "dense"
match_precision = "q4_k_m"
frameworks.poot         = { precision = "q4_k", caveat = "Q4_K_M stores Q4_K and Q6_K tensors (Q6_K for half of the attention-V and FFN-down weights); the row's precision is the dominant one" }
frameworks.candle       = { support = false, reason = "not in the standing grid: candle runs only the two bf16 qwen3 rows" }
frameworks.transformers = { support = false, reason = "not in the standing grid: transformers runs bf16 and MXFP4 checkpoints, not this GGUF" }
frameworks.vllm         = { support = false, reason = "dropped from the standing grid (2026-10-24): too hard to run properly, llama.cpp is the reference" }
frameworks.llamacpp     = { support = true, precision = "q4_k_m", caveat = "the same quant file as poot" }

[[model]]
id = "qwen3-8b"
arch = "Qwen3ForCausalLM"
hf_repo = "Qwen/Qwen3-8B"
local_dir = "qwen3-8b"
size_class = "mid"
group = "dense"
match_precision = "bf16"
frameworks.poot         = { precision = "bf16" }
frameworks.candle       = { support = true, precision = "bf16" }
frameworks.transformers = { support = true, precision = "bf16" }
frameworks.vllm         = { support = false, reason = "dropped from the standing grid (2026-10-24): too hard to run properly, llama.cpp is the reference" }
frameworks.llamacpp     = { support = true, precision = "f16", caveat = "GGUF f16 vs bf16" }

[[model]]
id = "qwen3-14b"
arch = "Qwen3ForCausalLM"
hf_repo = "Qwen/Qwen3-14B"
local_dir = "qwen3-14b"
size_class = "xl"           # 14B bf16 ~28GB - needs a 48GB GPU (A6000 / A40)
group = "dense"
match_precision = "bf16"
# xl tier real sweep (RunPod L40S 48GB, 2026-08-20; the snapshot predates the identity contract and is in git history):
frameworks.poot         = { precision = "bf16", caveat = "SIGKILL (rc=-9) during model load, before any GPU work: peak host RSS 116.1 GiB (124.7 GB) against this pod's ~116.4 GiB cgroup memory.max (single-GPU L40S RunPod pods are RAM-capped independent of the 48GB VRAM; not a poot correctness bug). isl 128/512/2048/8192 all untested as a result - poot's own load path needs a lower peak-RSS footprint (or a higher-RAM pod tier) to bench this model size" }
frameworks.candle       = { support = true, precision = "bf16", caveat = "isl 8192 hits CUDA_ERROR_ILLEGAL_ADDRESS at peak_vram 44.76 GiB (near the L40S's ~46 GiB ceiling) - a real VRAM-exhaustion failure for this model+ISL on a 48GB GPU (not a poot bug). isl 128/512/2048 completed per the runner's own progress log before the isl=8192 crash, but no numeric decode-curve data survives for any point: the harness only parses the runner's FINAL stdout JSON, and the process died before printing it, so this cell is recorded as a full error, not a partial curve" }
frameworks.transformers = { support = true, precision = "bf16" }
frameworks.vllm         = { support = false, reason = "dropped from the standing grid (2026-10-24): too hard to run properly, llama.cpp is the reference" }
frameworks.llamacpp     = { support = true, precision = "f16", caveat = "GGUF f16 vs bf16" }

# Phi-4 (14B) reuses Phi3ForCausalLM, which poot runs (spec phi3). MIT, not gated. 14B bf16 ~28GB needs a
# 48GB GPU; 4-bit fits 24GB.
[[model]]
id = "phi-4"
arch = "Phi3ForCausalLM"
hf_repo = "microsoft/phi-4"
local_dir = "phi-4"
size_class = "xl"
group = "dense"
match_precision = "bf16"
frameworks.poot         = { precision = "bf16" }
frameworks.candle       = { support = false, reason = "candle-transformers 0.10.2 has no Phi3 (validated 2026-06-15: 'unsupported arch Phi3ForCausalLM')" }
frameworks.transformers = { support = true, precision = "bf16" }
# xl tier real sweep (RunPod RTX A6000 48GB, 2026-08-20; the snapshot predates the identity contract and is in git history):
frameworks.vllm         = { support = false, reason = "dropped from the standing grid (2026-10-24): too hard to run properly, llama.cpp is the reference" }
frameworks.llamacpp     = { support = true, precision = "f16", caveat = "GGUF f16 vs bf16" }

