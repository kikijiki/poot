hf_include = ["UD-Q4_K_XL/*.gguf"]
local_dir = "qwen3.8-flash-next-gguf"
weights_file = "UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf"
size_class = "xl"
group = "moe"
match_precision = "q4_k_xl"
frameworks.poot         = { precision = "q4_k", caveat = "UD-Q4_K_XL stores Q4_K, IQ4_NL, Q5_1, Q8_0 and Q5_K tensors; the row's precision is the dominant one" }
frameworks.candle       = { support = false, reason = "candle-transformers has no qwen4exp architecture" }
frameworks.transformers = { support = false, reason = "transformers 5.20.2's GGUF loader has no qwen4exp mapping, and the FP8 repo (185 GB) does not fit one H200" }
frameworks.vllm         = { support = false, reason = "dropped from the standing grid (2026-10-24): too hard to run properly, llama.cpp is the reference" }
frameworks.llamacpp     = { support = true, precision = "q4_k_xl", caveat = "the same quant files as poot; whether the image's llama.cpp tag knows qwen4exp is the cell's result" }

# Qwen3.8-Flash-Next UD-Q2_K_XL (GGUF arch qwen4exp, 78.9 GB in three shards): the same repo and directory as the Q4
# entry, a different include. It fits one RTX PRO 6000 Blackwell (96 GB), where the 111 GB Q4_K_XL needs an H200.
# poot's precision is the dtype most of the store's bytes are in: IQ4_NL (65.2 % of the shards' bytes; IQ2_XS 28.9 %,
# Q5_K 2.5 %, Q8_0 1.0 %, from the shards' tensor directories).
[[model]]
id = "qwen3.8-flash-next-q2"
arch = "qwen4exp"
hf_repo = "unsloth/Qwen3.8-Flash-Next-GGUF"
hf_include = ["UD-Q2_K_XL/*.gguf"]
local_dir = "qwen3.8-flash-next-gguf"
weights_file = "UD-Q2_K_XL/Qwen3.8-Flash-Next-UD-Q2_K_XL-00001-of-00003.gguf"
size_class = "xl"
group = "moe"
match_precision = "q2_k_xl"
frameworks.poot         = { precision = "iq4_nl", caveat = "UD-Q2_K_XL stores IQ4_NL, IQ2_XS, Q5_K, Q8_0 and smaller shares of other types; the row's precision is the dominant one" }
frameworks.candle       = { support = false, reason = "candle-transformers has no qwen4exp architecture" }
frameworks.transformers = { support = false, reason = "transformers 5.20.2's GGUF loader has no qwen4exp mapping, and the FP8 repo (185 GB) does not fit one 96 GB card" }
frameworks.vllm         = { support = false, reason = "dropped from the standing grid (2026-10-24): too hard to run properly, llama.cpp is the reference" }
frameworks.llamacpp     = { support = true, precision = "q2_k_xl", caveat = "the same quant files as poot; whether the image's llama.cpp tag knows qwen4exp is the cell's result" }

# Qwen3.8-27B UD-Q4_K_XL (GGUF arch qwen35, one 17.6 GB file): the quant side of the 27B comparison with the FP8
# checkpoint above, on the same quant llama.cpp runs. Only that file is fetched (the repo holds every quant, 416 GB).
# poot's precision is the dtype most of the file's bytes are in: Q5_K (45.2 %; IQ4_XS 17.8 %, Q4_K 17.4 %, Q6_K
# 16.3 %, from the tensor directory of the file's header).
[[model]]
id = "qwen3.8-27b-q4"
arch = "qwen35"
hf_repo = "unsloth/Qwen3.8-27B-GGUF"
hf_include = ["Qwen3.8-27B-UD-Q4_K_XL.gguf"]
local_dir = "qwen3.8-27b-gguf"
weights_file = "Qwen3.8-27B-UD-Q4_K_XL.gguf"
size_class = "xl"
group = "dense"
match_precision = "q4_k_xl"
frameworks.poot         = { precision = "q5_k", caveat = "UD-Q4_K_XL stores Q5_K, IQ4_XS, Q4_K, Q6_K and smaller shares of other types; the row's precision is the dominant one" }
frameworks.candle       = { support = false, reason = "candle-transformers has no Qwen3.5 gated-delta-net architecture" }
frameworks.transformers = { support = false, reason = "transformers 5.20.2's GGUF loader maps no qwen35 architecture" }
frameworks.vllm         = { support = false, reason = "dropped from the standing grid (2026-10-24): too hard to run properly, llama.cpp is the reference" }
frameworks.llamacpp     = { support = true, precision = "q4_k_xl", caveat = "the same quant file as poot" }
