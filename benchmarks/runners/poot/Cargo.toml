# spec 112: the poot runner for the cross-framework benchmark suite (the poot-llm driver). Built with a plain `cargo build --release`; kernels are generated at runtime by kernelgen. Runs
# warmup + timed iterations of a fixed (prompt, gen-tokens) scenario and emits one JSON line (the suite
# runner contract). A member of the root workspace, so it shares the root Cargo.lock.
[package]
name = "poot-bench-runner"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "poot-bench-runner"
path = "src/main.rs"

# POOT-1333: the poot side of the llama.cpp correctness comparison (teacher-forced top-k log-probabilities and the
# greedy continuation of a token sequence).
[[bin]]
name = "poot-score"
path = "src/bin/score.rs"

[dependencies]
poot-llm.workspace = true
poot-executor.workspace = true
poot-models.workspace = true
poot-profile.workspace = true
poot-quant.workspace = true
anyhow.workspace = true
blake3.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
poot-models = { workspace = true, features = ["test-support"] }
poot-quant = { workspace = true, features = ["test-support"] }
poot-runtime-common.workspace = true
poot-target.workspace = true
poot-test-util.workspace = true
poot-tensor.workspace = true
tokenizers.workspace = true

[lints]
workspace = true
