<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="687" viewBox="0 0 1200 687">
  <title>One Rust kernel, three GPU targets</title>
  <desc>One Rust kernel compiled to SPIR-V, PTX and AMDGCN</desc>
  <style>
    text { font-family: "DejaVu Sans Mono", monospace; fill: #e8eaf0; }
    .bg { fill: #0d1017; }
    .box { fill: #151a24; stroke-width: 1.6; }
    .teal { stroke: #2dd4bf; } .blue { stroke: #60a5fa; } .purple { stroke: #a78bfa; }
    .amber { stroke: #f5b83d; } .red { stroke: #fb7185; } .grey { stroke: #2a3040; }
    .link { stroke: #8b93a3; stroke-width: 1.6; fill: none; }
    .head { fill: #8b93a3; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #8b93a3; }
    .h { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .l { font-size: 15px; font-weight: 700; }
    .d { font-size: 12px; fill: #8b93a3; text-anchor: middle; }
    .n { font-size: 12px; fill: #8b93a3; }
    .m { font-size: 15px; text-anchor: middle; }
    .code { font-size: 14px; }
    .tx-teal { fill: #2dd4bf; } .tx-blue { fill: #60a5fa; } .tx-purple { fill: #a78bfa; }
    .tx-amber { fill: #f5b83d; } .tx-red { fill: #fb7185; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="687"/>
  <text class="title" x="40" y="52">One Rust kernel, three GPU targets</text>
  <text class="sub" x="40" y="82">Imported kernels are ordinary Rust checked by rustc, with no cuBLAS or cuDNN</text>

  <g class="link">
    <path d="M480 181 H530" marker-end="url(#arrow)"/>
    <path d="M650 216 V256" marker-end="url(#arrow)"/>
    <path d="M650 326 V366" marker-end="url(#arrow)"/>
    <path d="M770 401 L840 172" marker-end="url(#arrow)"/>
    <path d="M770 401 L840 276" marker-end="url(#arrow)"/>
    <path d="M770 401 L840 382" marker-end="url(#arrow)"/>
  </g>

  <rect class="box teal" x="40" y="126" width="440" height="302" rx="10"/>
  <text class="l tx-teal" x="60" y="154">Rust source</text>
  <text class="code" xml:space="preserve" x="60" y="190">#[kernel]</text>
  <text class="code" xml:space="preserve" x="60" y="212">pub fn elementwise_add(</text>
  <text class="code" xml:space="preserve" x="60" y="234">    a: &amp;[f32],</text>
  <text class="code" xml:space="preserve" x="60" y="256">    b: &amp;[f32],</text>
  <text class="code" xml:space="preserve" x="60" y="278">    out: &amp;mut [f32],</text>
  <text class="code" xml:space="preserve" x="60" y="300">) {</text>
  <text class="code" xml:space="preserve" x="60" y="322">    let i = thread_index();</text>
  <text class="code" xml:space="preserve" x="60" y="344">    if i &lt; out.len() {</text>
  <text class="code" xml:space="preserve" x="60" y="366">        out[i] = a[i] + b[i];</text>
  <text class="code" xml:space="preserve" x="60" y="388">    }</text>
  <text class="code" xml:space="preserve" x="60" y="410">}</text>

  <rect class="box blue" x="530" y="146" width="240" height="70" rx="10"/>
  <text class="h tx-blue" x="650" y="176">pootc</text>
  <text class="d" x="650" y="198">Stable MIR import</text>
  <rect class="box blue" x="530" y="256" width="240" height="70" rx="10"/>
  <text class="h tx-blue" x="650" y="286">Kernel IR</text>
  <text class="d" x="650" y="308">basic blocks, .kir.json</text>
  <rect class="box blue" x="530" y="366" width="240" height="70" rx="10"/>
  <text class="h tx-blue" x="650" y="396">poot-codegen</text>
  <text class="d" x="650" y="418">kernel IR to LLVM IR</text>

  <rect class="box purple" x="840" y="126" width="320" height="92" rx="10"/>
  <text class="h tx-purple" x="1000" y="162">SPIR-V</text>
  <text class="d" x="1000" y="186">wgpu and raw Vulkan</text>
  <rect class="box amber" x="840" y="232" width="320" height="92" rx="10"/>
  <text class="h tx-amber" x="1000" y="268">PTX</text>
  <text class="d" x="1000" y="292">NVIDIA via cudarc</text>
  <rect class="box red" x="840" y="338" width="320" height="92" rx="10"/>
  <text class="h tx-red" x="1000" y="374">AMDGCN .hsaco</text>
  <text class="d" x="1000" y="398">ROCm via HSA</text>

  <text class="n" x="40" y="496">Kernels written this way</text>
  <g class="teal" fill="none">
    <rect class="box teal" x="40" y="514" width="150" height="36" rx="8"/>
    <text class="m" style="font-size:14px" x="115" y="537">gemv_coalesced</text>
    <rect class="box teal" x="202" y="514" width="217" height="36" rx="8"/>
    <text class="m" style="font-size:14px" x="310" y="537">gemv_batched_coalesced</text>
    <rect class="box teal" x="431" y="514" width="200" height="36" rx="8"/>
    <text class="m" style="font-size:14px" x="531" y="537">tiled_gemm_coarsened</text>
    <rect class="box teal" x="643" y="514" width="183" height="36" rx="8"/>
    <text class="m" style="font-size:14px" x="734" y="537">tiled_gemm_batched</text>
    <rect class="box teal" x="838" y="514" width="217" height="36" rx="8"/>
    <text class="m" style="font-size:14px" x="946" y="537">packed_bf16_row_gather</text>
    <rect class="box teal" x="40" y="562" width="217" height="36" rx="8"/>
    <text class="m" style="font-size:14px" x="148" y="585">packed_e4m3_row_gather</text>
    <rect class="box teal" x="269" y="562" width="133" height="36" rx="8"/>
    <text class="m" style="font-size:14px" x="335" y="585">argmax_chunk</text>
    <rect class="box teal" x="414" y="562" width="150" height="36" rx="8"/>
    <text class="m" style="font-size:14px" x="489" y="585">argmax_combine</text>
    <rect class="box teal" x="576" y="562" width="150" height="36" rx="8"/>
    <text class="m" style="font-size:14px" x="651" y="585">random_uniform</text>
    <rect class="box teal" x="738" y="562" width="268" height="36" rx="8"/>
    <text class="m" style="font-size:14px" x="872" y="585">sample_gumbel_argmax_batched</text>
  </g>
  <text class="n" x="40" y="640">Anything outside the accepted Rust subset gets a named diagnostic, never a silent miscompile.</text>
</svg>
