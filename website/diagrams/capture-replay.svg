<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635">
  <title>Record once, replay every token</title>
  <desc>Capture the decode step once and replay it every token, one host call per token</desc>
  <style>
    text { font-family: "DejaVu Sans Mono", monospace; fill: #e8eaf0; }
    .bg { fill: #0d1017; }
    .box { fill: #151a24; stroke-width: 1.6; }
    .teal { stroke: #2dd4bf; } .blue { stroke: #60a5fa; } .purple { stroke: #a78bfa; }
    .amber { stroke: #f5b83d; } .red { stroke: #fb7185; } .grey { stroke: #2a3040; }
    .link { stroke: #8b93a3; stroke-width: 1.6; fill: none; }
    .head { fill: #8b93a3; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #8b93a3; }
    .h { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .l { font-size: 15px; font-weight: 700; }
    .d { font-size: 12px; fill: #8b93a3; text-anchor: middle; }
    .n { font-size: 12px; fill: #8b93a3; }
    .m { font-size: 15px; text-anchor: middle; }
    .code { font-size: 14px; }
    .tx-teal { fill: #2dd4bf; } .tx-blue { fill: #60a5fa; } .tx-purple { fill: #a78bfa; }
    .tx-amber { fill: #f5b83d; } .tx-red { fill: #fb7185; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="635"/>
  <text class="title" x="40" y="52">Record once, replay every token</text>
  <text class="sub" x="40" y="82">One fixed-shape decode graph. Each backend replays it its own way.</text>
  <text class="n" x="40" y="142">changes per step, stable address (plus WriteMap, MropePosition, ...)</text>

  <g class="link">
    <path d="M270 194 L340 235" marker-end="url(#arrow)"/>
    <path d="M270 272 H340" marker-end="url(#arrow)"/>
    <path d="M270 350 L340 309" marker-end="url(#arrow)"/>
    <path d="M645 272 L700 190" marker-end="url(#arrow)"/>
    <path d="M645 272 L700 252" marker-end="url(#arrow)"/>
    <path d="M645 272 L700 314" marker-end="url(#arrow)"/>
    <path d="M645 272 L700 376" marker-end="url(#arrow)"/>
  </g>

  <rect class="box blue" x="40" y="166" width="230" height="56" rx="10"/>
  <text class="m" x="155" y="200">Slot::Token</text>
  <rect class="box blue" x="40" y="244" width="230" height="56" rx="10"/>
  <text class="m" x="155" y="278">Slot::Pos</text>
  <rect class="box blue" x="40" y="322" width="230" height="56" rx="10"/>
  <text class="m" x="155" y="356">Slot::SlotMap</text>

  <rect class="box teal" x="345" y="166" width="300" height="212" rx="12" style="stroke-width:2.4"/>
  <text class="h tx-teal" x="495" y="222">captured decode</text>
  <text class="m" x="495" y="262">fixed-capacity KV</text>
  <text class="m" x="495" y="284">mask computed from Pos</text>
  <text class="d" x="495" y="326">same shape every token</text>

  <rect class="box amber" x="704" y="166" width="456" height="50" rx="10"/>
  <text class="l tx-amber" x="724" y="188">PTX</text>
  <text class="n" x="724" y="206">CUDA graph: cuGraphLaunch, one call</text>
  <rect class="box purple" x="704" y="228" width="456" height="50" rx="10"/>
  <text class="l tx-purple" x="724" y="250">wgpu</text>
  <text class="n" x="724" y="268">cached pipelines, re-encode, one submit</text>
  <rect class="box purple" x="704" y="290" width="456" height="50" rx="10"/>
  <text class="l tx-purple" x="724" y="312">raw Vulkan</text>
  <text class="n" x="724" y="330">recorded command buffers, resubmitted</text>
  <rect class="box red" x="704" y="352" width="456" height="50" rx="10"/>
  <text class="l tx-red" x="724" y="374">ROCm</text>
  <text class="n" x="724" y="392">recorded HSA AQL packets, resubmitted</text>

  <text class="n" x="40" y="441">host driver calls per token</text>
  <text class="m" style="text-anchor:start" x="40" y="500">naive</text>
  <g fill="#fb7185">
    <rect x="240" y="476" width="22" height="36" rx="4"/>
    <rect x="270" y="476" width="22" height="36" rx="4"/>
    <rect x="300" y="476" width="22" height="36" rx="4"/>
    <rect x="330" y="476" width="22" height="36" rx="4"/>
    <rect x="360" y="476" width="22" height="36" rx="4"/>
    <rect x="390" y="476" width="22" height="36" rx="4"/>
    <rect x="420" y="476" width="22" height="36" rx="4"/>
    <rect x="450" y="476" width="22" height="36" rx="4"/>
    <rect x="480" y="476" width="22" height="36" rx="4"/>
    <rect x="510" y="476" width="22" height="36" rx="4"/>
    <rect x="540" y="476" width="22" height="36" rx="4"/>
    <rect x="570" y="476" width="22" height="36" rx="4"/>
    <rect x="600" y="476" width="22" height="36" rx="4"/>
    <rect x="630" y="476" width="22" height="36" rx="4"/>
    <rect x="660" y="476" width="22" height="36" rx="4"/>
    <rect x="690" y="476" width="22" height="36" rx="4"/>
    <rect x="720" y="476" width="22" height="36" rx="4"/>
    <rect x="750" y="476" width="22" height="36" rx="4"/>
    <rect x="780" y="476" width="22" height="36" rx="4"/>
    <rect x="810" y="476" width="22" height="36" rx="4"/>
    <rect x="840" y="476" width="22" height="36" rx="4"/>
    <rect x="870" y="476" width="22" height="36" rx="4"/>
    <rect x="900" y="476" width="22" height="36" rx="4"/>
    <rect x="930" y="476" width="22" height="36" rx="4"/>
    <rect x="960" y="476" width="22" height="36" rx="4"/>
    <rect x="990" y="476" width="22" height="36" rx="4"/>
    <rect x="1020" y="476" width="22" height="36" rx="4"/>
    <rect x="1050" y="476" width="22" height="36" rx="4"/>
  </g>
  <text class="n" x="240" y="534">one call per dispatch, 2-10 us each</text>
  <text class="m tx-teal" style="text-anchor:start" x="40" y="578">captured</text>
  <rect x="240" y="554" width="22" height="36" rx="4" fill="#2dd4bf"/>
  <text class="n" x="276" y="577">one host call per token</text>
</svg>
